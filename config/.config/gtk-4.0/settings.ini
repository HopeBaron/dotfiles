[Settings]
# GTK4 outside GNOME reads this, not the gsettings key install.sh also sets
# (that one covers GTK3). swaync is GTK4.
gtk-icon-theme-name=Gruvbox-Plus-Dark
gtk-theme-name=Gruvbox-Material
# GTK4's built-in theme picks light/dark from this; without it plain GTK4 apps
# (pavucontrol) got the light base: white buttons, white backdrop text.
# libadwaita logs a harmless "unsupported" warning about it.
gtk-application-prefer-dark-theme=1
gtk-font-name=Roboto 10
