# kitty -- hand-written. Colours live in colors.conf (generated; see theme/render.sh).

include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

cursor_shape             beam
scrollback_lines         10000
enable_audio_bell        no
window_padding_width     8
confirm_os_window_close  0

# Needed for `kitty @ load-config` to apply theme changes without a restart.
allow_remote_control yes
