# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)
#
# qt6ct's colour-scheme format: 21 #AARRGGBB values per state, in the fixed
# QPalette::ColorRole order below. Verified against a real, working scheme
# (github.com/giuji/gruvbox-qt6ct) rather than reconstructed from memory --
# the role order is fixed by Qt and getting it wrong silently miscolours
# random widgets instead of failing to load.
#
# Roles, in order:
#  1 WindowText  2 Button   3 Light      4 Midlight  5 Dark   6 Mid
#  7 Text        8 BrightText 9 ButtonText 10 Base   11 Window 12 Shadow
# 13 Highlight  14 HighlightedText 15 Link 16 LinkVisited 17 AlternateBase
# 18 ToolTipBase 19 ToolTipText  20 PlaceholderText  21 Accent
#
# Highlight, Accent, Link, and Button (with ButtonText -> BG0 for contrast)
# all share ONE accent: BLUE. Button and Highlight used to disagree (button
# surface was neutral BG3 while Highlight/Link were blue), which read as two
# competing accent languages in one dialog. Blue was chosen over rofi/
# waybar's yellow specifically for buttons/contrast; note upstream Gruvbox
# Material's own reference (gruvbox-material.vim) actually defaults generic
# selection to NEUTRAL GREY, reserving colour for specific cues (Search is
# hardcoded green) -- so a fully neutral button would be the more
# philosophy-conservative choice, if ever reconsidered.
# Tooltip and placeholder roles match the rofi/waybar tooltip and placeholder
# colours.
#
# Button (role 2) uses BG3, not BG_DIM: everywhere else in this repo an
# interactive/elevated surface is LIGHTER than its base (rofi's selected row,
# waybar's islands, tooltips), never darker. Copying the reference theme's
# Button->bg0_h (its darkest tier) verbatim made buttons read as a sunken
# hole rather than a control -- black-on-black, since ButtonText is FG0.
# Window (role 11) correctly keeps BG_DIM: a slightly recessed dialog
# backdrop is a real, intentional choice, unlike a recessed button.

