<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Roboto (the UI font) has no Arabic glyphs, so Arabic text fell through
       to a mismatched fallback. Chain Noto Sans Arabic UI (Google's companion to
       Roboto, from noto-fonts) straight after it, for every app at once. The
       UI cut: its Latin-sized line heights keep low dots from being clipped
       in tight boxes (WhatsApp Web's contact names lost a final yeh's dots,
       so it read as alef maksura).
       binding="same": a default (weak) alias ranks below the icon font that
       every config lists second, whose own Arabic fallback then wins. -->
  <alias binding="same">
    <family>Roboto</family>
    <accept><family>Noto Sans Arabic UI</family></accept>
  </alias>

  <!-- Apps that ask for another font (a website's Arial/Helvetica) fall back
       by language for Arabic text, and Firefox's lookup ("sans-serif,
       lang=ar") got DejaVu Sans. Put the same Arabic font first for that
       lookup only: it also carries digits, and ranking it first for every
       sans-serif lookup would restyle numbers everywhere. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans Arabic UI</string></edit>
  </match>
</fontconfig>
