<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Roboto (the UI font) has no Arabic glyphs, so Arabic text fell through
       to a mismatched fallback. Chain Noto Sans Arabic (Google's companion to
       Roboto, from noto-fonts) straight after it, for every app at once.
       binding="same": a default (weak) alias ranks below the icon font that
       every config lists second, whose own Arabic fallback then wins. -->
  <alias binding="same">
    <family>Roboto</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
</fontconfig>
