# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)

general {
    hide_cursor = true
}

background {
    monitor =
    # Blurred screenshot of whatever's already on screen instead of a second
    # copy of the wallpaper path -- stays in sync automatically with whatever
    # rofi-wallpaper.sh (SUPER+.) last picked, nothing to keep in sync here.
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgba(282828ff)
}

input-field {
    monitor =
    size = 260, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(45403daa)
    inner_color = rgba(32302fee)
    font_color = rgba(d4be98ff)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(a9b665ee)
    fail_color  = rgba(ea6962ee)
    fail_text   = <i>$FAIL <b>($ATTEMPTS)</b></i>

    placeholder_text = <i>Password...</i>
    fade_on_empty = true

    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(d4be98ff)

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(a89984ff)

    position = 0, 90
    halign = center
    valign = center
}

# Username, above the input field
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(928374ff)

    position = 0, -150
    halign = center
    valign = center
}
