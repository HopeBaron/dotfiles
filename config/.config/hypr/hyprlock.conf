# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)

general {
    hide_cursor = true
}

background {
    monitor =
    # Blurred screenshot of whatever's already on screen -- always matches
    # the live wallpaper (whatever hyprpaper.conf currently points at) with
    # no separate path to keep in sync. This previously hung/crashed on this
    # NVIDIA (proprietary driver) setup, but that turned out to be the
    # hardware-cursor/VT-switch bug fixed by cursor.no_hardware_cursors in
    # hyprland.lua, not the screencopy path itself -- confirmed working now.
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgba(282828ff)
}

input-field {
    monitor =
    size = 265, 34
    outline_thickness = 1
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(5a524cff)
    inner_color = rgba(32302fd9)
    # Dots are drawn in font_color; the placeholder carries its own colour.
    font_color = rgba(a9b665ff)
    font_family = Roboto

    check_color = rgba(a9b665ee)
    fail_color  = rgba(ea6962ee)
    fail_text   = <b>$FAIL ($ATTEMPTS)</b>

    placeholder_text = <span foreground="##928374"><b>Password</b></span>
    fade_on_empty = false

    position = -21, -60
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = Roboto
    color = rgba(d4be98ff)

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = Roboto
    color = rgba(a89984ff)

    position = 0, 90
    halign = center
    valign = center
}

# Username, above the password field. Plain text: a lock screen always
# unlocks the current user, so there is nothing to pick here.
label {
    monitor =
    text = $USER
    font_size = 12
    font_family = Roboto
    color = rgba(928374ff)

    position = 0, -20
    halign = center
    valign = center
}

# Unlock button, inline to the right of the password field (265 + 8 + 34 =
# the SDDM form's 307px). Drawn only -- hyprlock has no buttons; Enter submits.
shape {
    monitor =
    size = 34, 34
    rounding = 4
    color = rgba(a9b665ff)

    position = 136, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰿆
    font_size = 12
    # Propo, not the plain variant: that one squeezes icons into a text cell
    # and clips the open shackle.
    font_family = JetBrainsMono Nerd Font Propo
    color = rgba(282828ff)
    zindex = 1

    position = 136, -60
    halign = center
    valign = center
}
