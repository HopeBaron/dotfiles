# hypridle -- idle timeout daemon, chained into hyprlock/systemd. Autostarted
# from hyprland.lua. No colours here, so unlike hyprlock.conf this is a plain
# file, not a theme/templates/ one (same convention as hyprpaper.conf).
#
# Tune the `timeout` values (seconds) to taste.

general {
    # Avoids a second hyprlock stacking on top if one's already up (e.g. the
    # power-menu's own Lock entry fired first).
    lock_cmd = pidof hyprlock || hyprlock
    # Locks before ANY sleep -- timeout-triggered suspend below, a manual
    # `systemctl suspend` from the power menu, or a lid-close handled by
    # systemd-logind -- so nothing puts the screen to sleep unlocked.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim at 4 minutes idle; restore brightness on the next activity.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock at 5 minutes idle.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend at 15 minutes idle.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
