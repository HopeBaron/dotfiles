# hyprpaper -- wallpaper daemon, autostarted by modules/autostart.lua.
#
# The wallpaper itself is not set here: `mars-wallpaper set` (or SUPER+. ->
# Wallpaper) saves it to the state file sourced below, so switching never
# edits this tracked file. With no state file yet, hyprpaper draws nothing
# and Hyprland's misc.background_color (the theme's bg0) shows instead.
#
# Syntax note: hyprpaper >= 0.8 ignores the old one-line
# `preload = ...` / `wallpaper = monitor,path` form silently; it wants a
# `wallpaper { }` block, which is what the state file contains.

source = ~/.local/state/mars/wallpaper.conf

splash = false
