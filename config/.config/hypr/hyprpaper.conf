# hyprpaper -- wallpaper daemon. Autostarted from hyprland.lua.
#
# SYNTAX: hyprpaper 0.8 rewrote its config. The one-liner form every guide
# still shows -- `preload = <path>` plus `wallpaper = <monitor>,<path>` -- is
# silently ignored by this version: it logs "Monitor X has no target" and draws
# nothing. `preload` no longer exists at all. Unknown keys raise no error, so a
# stale config fails quietly. 0.8 wants a `wallpaper { }` block per output.
#
# Images live in this repo's wallpapers/ dir (gitignored -- the PATH is
# tracked, the binaries aren't, to keep multi-MB images out of git history).
# rofi-wallpaper.sh (SUPER+.) rewrites the `path =` line below when you pick a
# new one, so the choice persists across reboots. On a machine where the file
# referenced here is missing, hyprpaper draws nothing and misc.background_color
# (Gruvbox bg0) shows through -- so the desktop degrades to the right colour
# rather than to black.

wallpaper {
    # Empty = fallback for every output.
    monitor =
    # `~` is expanded here (verified) -- keep it, so nothing machine-specific
    # gets committed.
    path = ~/personal/projects/mars/dotfiles/wallpapers/wallhaven-3qkggv.jpg
    # contain | cover | tile | fill. The image is 4:3 on a 16:9 panel, so cover
    # crops top and bottom instead of letterboxing.
    fit_mode = cover
}

splash = false
