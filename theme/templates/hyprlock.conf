# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)

general {
    hide_cursor = true
}

background {
    monitor =
    # Plain colour, not `path = screenshot` -- that path grabs a live dmabuf
    # frame via wlr-screencopy, which hung/crashed repeatedly on this NVIDIA
    # (proprietary driver) setup and once left the compositor stuck mid-lock.
    # A flat colour needs no GPU screencopy at all.
    color = rgba(${BG0}ff)
}

input-field {
    monitor =
    size = 260, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(${BG3}aa)
    inner_color = rgba(${BG1}ee)
    font_color = rgba(${FG0}ff)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(${GREEN}ee)
    fail_color  = rgba(${RED}ee)
    fail_text   = <i>$FAIL <b>($ATTEMPTS)</b></i>

    placeholder_text = <i>Password...</i>
    fade_on_empty = true

    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(${FG0}ff)

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(${GREY2}ff)

    position = 0, 90
    halign = center
    valign = center
}

# Username, above the input field
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(${GREY1}ff)

    position = 0, -150
    halign = center
    valign = center
}
