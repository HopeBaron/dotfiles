# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)

general {
    hide_cursor = true
}

background {
    monitor =
    # Blurred screenshot of whatever's already on screen -- always matches
    # the live wallpaper (whatever hyprpaper.conf currently points at) with
    # no separate path to keep in sync. This previously hung/crashed on this
    # NVIDIA (proprietary driver) setup, but that turned out to be the
    # hardware-cursor/VT-switch bug fixed by cursor.no_hardware_cursors in
    # hyprland.lua, not the screencopy path itself -- confirmed working now.
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgba(${BG0}ff)
}

input-field {
    monitor =
    size = 260, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(${BG3}aa)
    inner_color = rgba(${BG1}ee)
    font_color = rgba(${FG0}ff)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(${GREEN}ee)
    fail_color  = rgba(${RED}ee)
    fail_text   = <i>$FAIL <b>($ATTEMPTS)</b></i>

    placeholder_text = <i>Password...</i>
    fade_on_empty = true

    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(${FG0}ff)

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(${GREY2}ff)

    position = 0, 90
    halign = center
    valign = center
}

# Username, above the input field
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(${GREY1}ff)

    position = 0, -150
    halign = center
    valign = center
}
