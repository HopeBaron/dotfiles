# GENERATED by theme/render.sh -- do not edit by hand.
# GTK4 outside GNOME reads this file, not the gsettings keys `mars-theme`
# also sets (those cover GTK3). swaync is a GTK4 app.
[Settings]
gtk-theme-name=Gruvbox-Material
gtk-icon-theme-name=${ICON_THEME}
# GTK4's built-in theme picks its light/dark base from this. libadwaita logs
# a harmless "unsupported" warning about it.
gtk-application-prefer-dark-theme=${GTK_PREFER_DARK}
gtk-font-name=Roboto 10
