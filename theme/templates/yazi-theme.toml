# GENERATED by theme/render.sh from theme/palette.sh -- do not edit by hand.
# Gruvbox Material (dark / medium / material)
#
# Note: yazi VALIDATES this file and refuses to start on a bad key, falling back
# to preset settings. Filetype rules match on `url`, `mime` or `is` -- not `name`.

[mgr]
cwd             = { fg = "#${AQUA}" }
hovered         = { fg = "#${BG0}", bg = "#${YELLOW}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#${YELLOW}", bold = true }
find_position = { fg = "#${PURPLE}", bold = true }

symlink_target = { fg = "#${GREY1}", italic = true }

marker_copied   = { fg = "#${GREEN}",  bg = "#${GREEN}" }
marker_cut      = { fg = "#${RED}",    bg = "#${RED}" }
marker_marked   = { fg = "#${AQUA}",   bg = "#${AQUA}" }
marker_selected = { fg = "#${YELLOW}", bg = "#${YELLOW}" }

count_copied   = { fg = "#${BG0}", bg = "#${GREEN}" }
count_cut      = { fg = "#${BG0}", bg = "#${RED}" }
count_selected = { fg = "#${BG0}", bg = "#${YELLOW}" }

border_symbol = "│"
border_style  = { fg = "#${BG5}" }

[tabs]
active   = { fg = "#${BG0}", bg = "#${YELLOW}", bold = true }
inactive = { fg = "#${GREY1}", bg = "#${BG1}" }

[mode]
normal_main = { fg = "#${BG0}", bg = "#${YELLOW}", bold = true }
normal_alt  = { fg = "#${YELLOW}", bg = "#${BG1}" }
select_main = { fg = "#${BG0}", bg = "#${GREEN}", bold = true }
select_alt  = { fg = "#${GREEN}", bg = "#${BG1}" }
unset_main  = { fg = "#${BG0}", bg = "#${PURPLE}", bold = true }
unset_alt   = { fg = "#${PURPLE}", bg = "#${BG1}" }

[status]
overall  = { fg = "#${FG0}", bg = "#${BG1}" }
perm_sep = { fg = "#${GREY0}" }
perm_type = { fg = "#${BLUE}" }
perm_read = { fg = "#${YELLOW}" }
perm_write = { fg = "#${RED}" }
perm_exec  = { fg = "#${GREEN}" }
progress_label  = { fg = "#${FG1}", bold = true }
progress_normal = { fg = "#${YELLOW}", bg = "#${BG1}" }
progress_error  = { fg = "#${RED}", bg = "#${BG1}" }

[which]
cols = 3
mask            = { bg = "#${BG1}" }
cand            = { fg = "#${AQUA}" }
rest            = { fg = "#${GREY1}" }
desc            = { fg = "#${FG0}" }
separator       = "  "
separator_style = { fg = "#${BG5}" }

[confirm]
border  = { fg = "#${BG5}" }
title   = { fg = "#${YELLOW}" }
body    = { fg = "#${FG0}" }
list    = { fg = "#${AQUA}" }
btn_yes = { fg = "#${BG0}", bg = "#${GREEN}", bold = true }
btn_no  = { fg = "#${BG0}", bg = "#${RED}" }

[spot]
border   = { fg = "#${BG5}" }
title    = { fg = "#${YELLOW}" }
tbl_col  = { fg = "#${AQUA}" }
tbl_cell = { fg = "#${BG0}", bg = "#${YELLOW}" }

[notify]
title_info  = { fg = "#${GREEN}" }
title_warn  = { fg = "#${YELLOW}" }
title_error = { fg = "#${RED}" }

[pick]
border   = { fg = "#${BG5}" }
active   = { fg = "#${BG0}", bg = "#${YELLOW}" }
inactive = { fg = "#${FG0}" }

[input]
border   = { fg = "#${YELLOW}" }
title    = { fg = "#${FG1}" }
value    = { fg = "#${FG0}" }
selected = { bg = "#${BG3}" }

[cmp]
border   = { fg = "#${BG5}" }
active   = { fg = "#${BG0}", bg = "#${YELLOW}" }
inactive = { fg = "#${FG0}" }

[tasks]
border  = { fg = "#${BG5}" }
title   = { fg = "#${YELLOW}" }
hovered = { fg = "#${BG0}", bg = "#${YELLOW}" }

[help]
border  = { fg = "#${BG5}" }
chord   = { fg = "#${YELLOW}" }
action  = { fg = "#${FG0}" }
hovered = { fg = "#${BG0}", bg = "#${YELLOW}", bold = true }

[filetype]
rules = [
  { mime = "image/*",              fg = "#${PURPLE}" },
  { mime = "{audio,video}/*",      fg = "#${ORANGE}" },
  { mime = "application/{,g}zip",  fg = "#${RED}" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#${RED}" },
  { mime = "application/{pdf,doc,rtf}", fg = "#${AQUA}" },
  { url = "*/", fg = "#${BLUE}", bold = true },
  { url = "*", fg = "#${FG0}" },
]
