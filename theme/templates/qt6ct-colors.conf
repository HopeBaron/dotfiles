#   Window/Base         -> plain bg0, same as rofi/kitty's own background.
#   Shadow              -> BG_DIM, matching Hyprland's one use of it.
#   Link/LinkVisited    -> kitty's url_color is GREEN; purple has no existing
#                         precedent so it stays a plain secondary accent.
#   ToolTipBase/Text     -> bg1 / fg0.
#   PlaceholderText      -> rofi's entry placeholder-color (grey1).
#
