#   PlaceholderText.
#
# Green is used as a SINGLE accent role only -- Highlight/HighlightedText
# (waybar's `#workspaces button.active` treatment: green fill, bg0 text) and
# Link. Button/ButtonText are a plain neutral surface (bg3 / fg0) in every
# row, same as disabled/inactive -- painting the Button role itself green
# tints far more than push-buttons (tabs, headers, scrollbar troughs,
# spinboxes, comboboxes all use it under Fusion-style Qt), which is what was
# making whole windows read as solid green.
